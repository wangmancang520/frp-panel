name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./... && go test ./...
      - run: ./build.sh
        env:
          PANEL_REPO: ${{ github.repository }}
          VERSION: ${{ github.ref_name }}
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
